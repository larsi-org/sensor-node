name=SensorNode
version=0.1.0
author=Lars Schumann <larsi.org@gmail.com>
maintainer=Lars Schumann <larsi.org@gmail.com>
sentence=Wi-Fi provisioning and logging for ESP32 sensor nodes reporting to larsi.org/sensors/log.
paragraph=Falls back to a captive-portal setup page (network picker, password, node name, device id, write key) stored in NVS when it can't connect, then reconnects on later boots and posts readings using the log endpoint's channel-value wire protocol.
category=Communication
url=https://github.com/larsi-org/sensor-node
architectures=esp32
includes=SensorNode.h,SensorNodeBattery.h
depends=SparkFun MAX1704x Fuel Gauge Arduino Library
